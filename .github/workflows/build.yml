name: Build APK
on:
  push:
    branches: [ main, firebase-spark-sin-functions ]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar actualización (si subiste un actualizacion*.zip)
        run: |
          shopt -s nullglob
          aplicado=0
          for z in actualizacion*.zip; do
            echo "Aplicando $z ..."
            unzip -o -q "$z"
            rm "$z"
            aplicado=1
          done
          if [ "$aplicado" = "1" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Aplicar actualización" || echo "Sin cambios"
            git push
          fi

      - name: Verificar archivos
        run: |
          echo "Archivos del repositorio:"
          find . -path ./.git -prune -o -type f -print | sort | head -120
          test -f app/build.gradle || { echo "ERROR: FALTA app/build.gradle"; exit 1; }
          test -f app/google-services.json || { echo "ERROR: FALTA app/google-services.json"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mercado-personal-apk
          path: app/build/outputs/apk/debug/*.apk
